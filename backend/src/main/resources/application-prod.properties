# =========================================================================
# CONFIGURACIÓN DE PRODUCCIÓN - FinanceAI (Spring Boot)
# =========================================================================
spring.application.name=FinanceAI-Prod

# Base de Datos
spring.datasource.url=jdbc:mysql://${DB_HOST}/FinanceAI?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER_M}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Modelos Compartidos ONNX
app.shared-models.path=${SHARED_MODELS_PATH:/app/models}

# Seguridad JWT: Estricto sin valor por defecto (exige TOKEN_SECRETO en .env)
api.security.secret=${TOKEN_SECRETO}

# Desactivar trazas de SQL en registros de producción para evitar fuga de datos
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Niveles de registro controlados
logging.level.org.springframework=WARN
logging.level.G9_LATAM_Team_11_FinanceAI=INFO
