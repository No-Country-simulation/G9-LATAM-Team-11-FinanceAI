spring.application.name=demo

# Configuración Data Source apuntando al contenedor 'db'
spring.datasource.url=jdbc:mysql://db:3306/FinanceAI?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER_M:dev_user}
spring.datasource.password=${DB_PASSWORD:dev_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Flyway
spring.flyway.url=jdbc:mysql://db:3306/FinanceAI?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.flyway.user=${DB_ROOT:root}
spring.flyway.password=${DB_ROOT_PASSWORD:root_password}
spring.flyway.baseline-on-migrate=true

# Evita que el contexto web se apague solo
spring.main.web-application-type=servlet
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect