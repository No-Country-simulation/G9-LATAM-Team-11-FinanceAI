spring.application.name=demo

# Configuración de Data Source para MySQL
spring.datasource.url=jdbc:mysql://db:3306/FinanceAI?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración explícita para Flyway
spring.flyway.url=jdbc:mysql://db:3306/FinanceAI?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.flyway.user=root
spring.flyway.password=root_password
spring.flyway.baseline-on-migrate=true

# Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect