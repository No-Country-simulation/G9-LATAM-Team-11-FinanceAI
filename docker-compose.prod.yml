services:
  # 1. Base de Datos MySQL (Aislada y segura)
  db:
    image: mysql:8.0
    container_name: financeai_db_prod
    environment:
      MYSQL_DATABASE: FinanceAI
      MYSQL_USER: ${DB_USER:-${DB_USER_M:-dev_user}}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dev_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data_prod:/var/lib/mysql
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 400M

  # 2. Back-End: API REST (Java / Spring Boot optimizado)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: financeai_backend_prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=db
      - DB_USER_M=${DB_USER:-${DB_USER_M:-dev_user}}
      - DB_PASSWORD=${DB_PASSWORD:-dev_password}
      - TOKEN_SECRETO=${JWT_SECRET:-${TOKEN_SECRETO:-FinanceAI_Secret_Key_Super_Segura_2026_JWT_Token_HS256_Min}}
      - SHARED_MODELS_PATH=/app/models
    volumes:
      - ./shared-models:/app/models:ro # Montaje de solo lectura (read-only) por seguridad
    depends_on:
      - db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 600M

  # 3. Front-End & Reverse Proxy (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: financeai_frontend_prod
    ports:
      - "80:80" # Único puerto expuesto a internet
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 100M

volumes:
  mysql_data_prod:
