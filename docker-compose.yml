services:
  # 1. Base de Datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: financeai_db
    environment:
      POSTGRES_DB: ${DB_NAME:-financeai_db}
      POSTGRES_USER: ${DB_USER:-dev_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  # 2. Back-End: API REST (Java / Spring Boot)
  backend:
    image: eclipse-temurin:17-jdk
    container_name: financeai_backend
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://db:5432/${DB_NAME:-financeai_db}
      - DB_USER=${DB_USER:-dev_user}
      - DB_PASSWORD=${DB_PASSWORD:-dev_password}
      - OCI_STORAGE_BUCKET=${OCI_STORAGE_BUCKET:-financeai-bucket}
    volumes:
      - ./backend:/app
      - ./shared-models:/app/models
    working_dir: /app
    depends_on:
      - db
    restart: always

  # 3. Front-End: Interfaz de Usuario (Vue 3 + Vite)
  frontend:
    image: node:20-alpine
    container_name: financeai_frontend
    ports:
      - "127.0.0.1:8082:3000"
    volumes:
      - ./frontend:/app
    working_dir: /app
    restart: always

  # 4. Ciencia de Datos: Entorno de Entrenamiento y Serialización
  data-science:
    build:
      context: ./notebooks
      dockerfile: Dockerfile
    container_name: financeai_datascience
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./shared-models:/home/jovyan/work/models
    restart: always

volumes:
  pgdata:
